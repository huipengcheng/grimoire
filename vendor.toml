# External skill sources, synced via git subtree (squash merge).
#
# Each [<name>] is one source. `subdir` is the upstream prefix pulled (`.` for
# the repo root); `dest` is where it lands in this repo — keep it under skills/
# so discovery picks it up.
# `include` keeps only listed top-level paths from subdir. `exclude` drops a
# skill by leaf name (or an explicit path under subdir) after fetch. `rename`
# renames a leaf skill directory and rewrites its SKILL.md `name:` to match,
# as "<old>:<new>";
# this is the fork-by-rename escape when an upstream skill name would collide.
#
# Sync with: ./grimoire.sh sync [name] [--dry-run|--stat|--diff]

[mattpocock]
url     = "https://github.com/mattpocock/skills.git"
branch  = "main"
subdir  = "skills"
dest    = "skills/mattpocock"
exclude = ["grill-me", "migrate-to-shoehorn", "scaffold-exercises"]
rename  = ["review:matt-review"]

[humanizer]
url     = "https://github.com/blader/humanizer.git"
branch  = "main"
subdir  = "."
dest    = "skills/humanizer"

[anthropic]
url     = "https://github.com/anthropics/skills.git"
branch  = "main"
subdir  = "skills"
dest    = "skills/anthropic"
include = ["doc-coauthoring"]

[composiohq]
url     = "https://github.com/ComposioHQ/awesome-claude-skills.git"
branch  = "master"
subdir  = "."
dest    = "skills/composiohq"
include = ["content-research-writer"]
