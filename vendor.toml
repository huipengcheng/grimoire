# External skill sources, synced via git subtree (squash merge).
#
# Each [<name>] is one source. `subdir` is the upstream prefix pulled; `dest` is
# where it lands in this repo — keep it under skills/ so discovery picks it up.
# `exclude` drops a skill by leaf name (or an explicit path under subdir) after
# fetch. `rename` renames a leaf skill directory and rewrites its SKILL.md
# `name:` to match, as "<old>:<new>";
# this is the fork-by-rename escape when an upstream skill name would collide.
#
# Sync with: ./grimoire.sh sync [name] [--dry-run|--stat|--diff]

[mattpocock]
url     = "https://github.com/mattpocock/skills.git"
branch  = "main"
subdir  = "skills"
dest    = "skills/mattpocock"
exclude = ["grill-me", "migrate-to-shoehorn", "scaffold-exercises"]
rename  = ["review:matt-review"]
