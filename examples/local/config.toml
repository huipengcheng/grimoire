# Per-machine grimoire configuration.
#
# Copy this file to local/config.toml on each machine and edit as needed.
# The local/ directory is gitignored.

# Which assistants to install on this machine. Must be keys in registry.toml.
targets = ["claude"]

# Disable items by fully-qualified name: "<origin>/<kind>/<name>".
# <origin> is the install origin: "self" (grimoire's own, incl. vendored skills)
# or "local" (this machine).
disabled = [
  # "self/skills/tdd",            # any of grimoire's items, incl. vendored skills
  # "self/agents/eval-executor",
]
