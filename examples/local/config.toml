# Per-machine grimoire configuration.
#
# Copy this file to local/config.toml on each machine and edit as needed.
# The local/ directory is gitignored.

# Which assistants to install on this machine. Must be keys in registry.toml.
targets = ["claude"]

# Disable items by fully-qualified name: "<kind>/<name>".
# Drops the item from every layer — grimoire's own (incl. vendored skills) and
# this machine's local/ overrides alike.
disabled = [
  # "skills/tdd",               # any item by kind/name, incl. vendored skills
  # "agents/eval-executor",
]
