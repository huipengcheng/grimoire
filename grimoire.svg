<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&amp;family=Inconsolata:wght@300;400&amp;display=swap');
    </style>

    <!-- Parchment-dark background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d0b08"/>
      <stop offset="100%" stop-color="#141009"/>
    </linearGradient>

    <!-- Subtle vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a1510" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.7"/>
    </radialGradient>

    <!-- Center glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#c8922a" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#c8922a" stop-opacity="0"/>
    </radialGradient>

    <!-- Grain texture filter -->
    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise"/>
      <feBlend in="SourceGraphic" in2="grayNoise" mode="overlay" result="blend"/>
      <feComposite in="blend" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- Grain overlay -->
  <rect width="1280" height="640" fill="url(#bg)" filter="url(#grain)" opacity="0.4"/>

  <!-- Outer border frame -->
  <rect x="36" y="36" width="1208" height="568" fill="none" stroke="#c8922a" stroke-width="0.75" opacity="0.35"/>
  <rect x="44" y="44" width="1192" height="552" fill="none" stroke="#c8922a" stroke-width="0.35" opacity="0.2"/>

  <!-- Corner ornaments - top left -->
  <line x1="36" y1="36" x2="100" y2="36" stroke="#c8922a" stroke-width="1.5" opacity="0.7"/>
  <line x1="36" y1="36" x2="36" y2="100" stroke="#c8922a" stroke-width="1.5" opacity="0.7"/>
  <circle cx="36" cy="36" r="3" fill="#c8922a" opacity="0.7"/>

  <!-- Corner ornaments - top right -->
  <line x1="1244" y1="36" x2="1180" y2="36" stroke="#c8922a" stroke-width="1.5" opacity="0.7"/>
  <line x1="1244" y1="36" x2="1244" y2="100" stroke="#c8922a" stroke-width="1.5" opacity="0.7"/>
  <circle cx="1244" cy="36" r="3" fill="#c8922a" opacity="0.7"/>

  <!-- Corner ornaments - bottom left -->
  <line x1="36" y1="604" x2="100" y2="604" stroke="#c8922a" stroke-width="1.5" opacity="0.7"/>
  <line x1="36" y1="604" x2="36" y2="540" stroke="#c8922a" stroke-width="1.5" opacity="0.7"/>
  <circle cx="36" cy="604" r="3" fill="#c8922a" opacity="0.7"/>

  <!-- Corner ornaments - bottom right -->
  <line x1="1244" y1="604" x2="1180" y2="604" stroke="#c8922a" stroke-width="1.5" opacity="0.7"/>
  <line x1="1244" y1="604" x2="1244" y2="540" stroke="#c8922a" stroke-width="1.5" opacity="0.7"/>
  <circle cx="1244" cy="604" r="3" fill="#c8922a" opacity="0.7"/>

  <!-- Thin horizontal rule top -->
  <line x1="180" y1="170" x2="1100" y2="170" stroke="#c8922a" stroke-width="0.5" opacity="0.25"/>

  <!-- Thin horizontal rule bottom -->
  <line x1="180" y1="468" x2="1100" y2="468" stroke="#c8922a" stroke-width="0.5" opacity="0.25"/>

  <!-- Center diamond ornament top -->
  <polygon points="640,160 648,170 640,180 632,170" fill="none" stroke="#c8922a" stroke-width="0.8" opacity="0.5"/>

  <!-- Center diamond ornament bottom -->
  <polygon points="640,458 648,468 640,478 632,468" fill="none" stroke="#c8922a" stroke-width="0.8" opacity="0.5"/>

  <!-- Main title: grimoire -->
  <text
    x="640"
    y="295"
    font-family="'IM Fell English', 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif"
    font-size="112"
    font-weight="400"
    fill="#e8d5a3"
    text-anchor="middle"
    letter-spacing="18"
    opacity="0.95"
  >grimoire</text>

  <!-- Italic tagline -->
  <text
    x="640"
    y="358"
    font-family="'IM Fell English', 'Palatino Linotype', Palatino, Georgia, serif"
    font-size="22"
    font-style="italic"
    fill="#c8922a"
    text-anchor="middle"
    letter-spacing="1"
    opacity="0.75"
  >a spellbook for AI coding assistants</text>

  <!-- Bottom label row -->
  <text
    x="640"
    y="510"
    font-family="'Inconsolata', 'Courier New', monospace"
    font-size="13"
    font-weight="300"
    fill="#8a7355"
    text-anchor="middle"
    letter-spacing="6"
  >skills · agents · commands · hooks</text>

  <!-- Vignette overlay -->
  <rect width="1280" height="640" fill="url(#vignette)"/>
</svg>
